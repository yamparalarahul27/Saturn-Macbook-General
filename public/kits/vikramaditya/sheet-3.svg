2="94.112" stroke="#7c8895" stroke-width="0.35"/><line x1="87.000" y1="67.816" x2="87.000" y2="94.816" stroke="#7c8895" stroke-width="0.35"/><line x1="103.000" y1="68.520" x2="103.000" y2="95.520" stroke="#7c8895" stroke-width="0.35"/><line x1="38.000" y1="47.000" x2="56.000" y2="47.000" stroke="#a57865" stroke-width="0.25"/><line x1="38.000" y1="47.000" x2="38.000" y2="53.000" stroke="#a57865" stroke-width="0.25"/><line x1="123.000" y1="47.000" x2="141.000" y2="47.000" stroke="#a57865" stroke-width="0.25"/><line x1="123.000" y1="47.000" x2="123.000" y2="53.000" stroke="#a57865" stroke-width="0.25"/><line x1="173.000" y1="47.000" x2="191.000" y2="47.000" stroke="#a57865" stroke-width="0.25"/><line x1="173.000" y1="47.000" x2="173.000" y2="53.000" stroke="#a57865" stroke-width="0.25"/><line x1="128.000" y1="43.000" x2="145.000" y2="43.000" stroke="#a9b2bd" stroke-width="0.3"/><line x1="145.000" y1="43.000" x2="145.000" y2="58.000" stroke="#a9b2bd" stroke-width="0.3"/><line x1="145.000" y1="58.000" x2="128.000" y2="58.000" stroke="#a9b2bd" stroke-width="0.3"/><line x1="128.000" y1="58.000" x2="128.000" y2="43.000" stroke="#a9b2bd" stroke-width="0.3"/><line x1="179.000" y1="41.000" x2="196.000" y2="41.000" stroke="#a9b2bd" stroke-width="0.3"/><line x1="196.000" y1="41.000" x2="196.000" y2="56.000" stroke="#a9b2bd" stroke-width="0.3"/><line x1="196.000" y1="56.000" x2="179.000" y2="56.000" stroke="#a9b2bd" stroke-width="0.3"/><line x1="179.000" y1="56.000" x2="179.000" y2="41.000" stroke="#a9b2bd" stroke-width="0.3"/><line x1="198.000" y1="42.000" x2="225.857" y2="42.000" stroke="#7f8d9e" stroke-width="0.16" stroke-dasharray="0.5 1.1"/><line x1="225.857" y1="60.000" x2="198.000" y2="60.000" stroke="#7f8d9e" stroke-width="0.16" stroke-dasharray="0.5 1.1"/><line x1="198.000" y1="60.000" x2="198.000" y2="42.000" stroke="#7f8d9e" stroke-width="0.16" stroke-dasharray="0.5 1.1"/><text x="59.000" y="53.000" transform="rotate(0 59 53)" font-family="Arial, sans-serif" font-size="4" font-weight="700" fill="#84919e" text-anchor="middle">R33</text><polygon points="27.000,148.000 97.000,148.000 97.000,168.000 27.000,168.000" fill="#eeebf7" stroke="none" stroke-width="0.2"/><line x1="27.000" y1="148.000" x2="97.000" y2="148.000" stroke="#263243" stroke-width="0.32"/><line x1="97.000" y1="148.000" x2="97.000" y2="168.000" stroke="#263243" stroke-width="0.32"/><line x1="97.000" y1="168.000" x2="27.000" y2="168.000" stroke="#263243" stroke-width="0.32"/><line x1="27.000" y1="168.000" x2="27.000" y2="148.000" stroke="#263243" stroke-width="0.32"/><line x1="27.000" y1="158.000" x2="97.000" y2="158.000" stroke="#8896aa" stroke-width="0.15" stroke-dasharray="0.5 1"/><text x="62.000" y="155.000" transform="rotate(0 62 155)" font-family="Arial, sans-serif" font-size="2.1" font-weight="400" fill="#263243" text-anchor="middle">GLUE UNDER AFT DECK 3</text><text x="62.000" y="164.000" transform="rotate(0 62 164)" font-family="Arial, sans-serif" font-size="2.1" font-weight="400" fill="#263243" text-anchor="middle">GLUE UNDER FORWARD DECK 4</text><text x="121.000" y="145.000" transform="rotate(0 121 145.0)" font-family="Arial, sans-serif" font-size="2.7" font-weight="400" fill="#66758a" text-anchor="start">Keep deck pieces 3 and 4 flat. Do not fold their seam.</text><text x="121.000" y="149.500" transform="rotate(0 121 149.5)" font-family="Arial, sans-serif" font-size="2.7" font-weight="400" fill="#66758a" text-anchor="start">Place strip 5 under the two straight middle edges,</text><text x="121.000" y="154.000" transform="rotate(0 121 154.0)" font-family="Arial, sans-serif" font-size="2.7" font-weight="400" fill="#66758a" text-anchor="start">with 10 mm glued beneath each half. Butt the edges</text><text x="121.000" y="158.500" transform="rotate(0 121 158.5)" font-family="Arial, sans-serif" font-size="2.7" font-weight="400" fill="#66758a" text-anchor="start">together; match both the runway lines and the outline.</text><text x="121.000" y="163.000" transform="rotate(0 121 163.0)" font-family="Arial, sans-serif" font-size="2.7" font-weight="400" fill="#66758a" text-anchor="start">Then glue the joined deck onto the hull rim tabs.</text><text x="121.000" y="167.500" transform="rotate(0 121 167.5)" font-family="Arial, sans-serif" font-size="2.7" font-weight="400" fill="#66758a" text-anchor="start">Use 160-200 gsm paper to keep the broad deck firm.</text><line x1="12.000" y1="188.000" x2="285.000" y2="188.000" stroke="#d5dbe3" stroke-width="0.2"/><line x1="12.000" y1="194.000" x2="22.000" y2="194.000" stroke="#263243" stroke-width="0.32"/><text x="25.000" y="195.000" transform="rotate(0 25 195)" font-family="Arial, sans-serif" font-size="2.5" font-weight="400" fill="#263243" text-anchor="start">Cut: bold outline</text><line x1="66.000" y1="194.000" x2="76.000" y2="194.000" stroke="#315eea" stroke-width="0.22" stroke-dasharray="1.6 0.9"/><text x="79.000" y="195.000" transform="rotate(0 79 195)" font-family="Arial, sans-serif" font-size="2.5" font-weight="400" fill="#263243" text-anchor="start">Fold away from print</text><polygon points="138.000,191.500 147.000,191.500 147.000,196.000 138.000,196.000" fill="#eeebf7" stroke="#263243" stroke-width="0.2"/><text x="150.000" y="195.000" transform="rotate(0 150 195)" font-family="Arial, sans-serif" font-size="2.5" font-weight="400" fill="#263243" text-anchor="start">Glue tabs</text><text x="12.000" y="202.000" transform="rotate(0 12 202)" font-family="Arial, sans-serif" font-size="2.7" font-weight="700" fill="#263243" text-anchor="start">A4 landscape | Actual size / 100% | Single-sided | No fit-to-page</text><line x1="235.000" y1="199.000" x2="285.000" y2="199.000" stroke="#263243" stroke-width="0.3"/><line x1="235.000" y1="197.000" x2="235.000" y2="201.000" stroke="#263243" stroke-width="0.3"/><line x1="285.000" y1="197.000" x2="285.000" y2="201.000" stroke="#263243" stroke-width="0.3"/><text x="260.000" y="195.000" transform="rotate(0 260 195)" font-family="Arial, sans-serif" font-size="2.3" font-weight="400" fill="#263243" text-anchor="middle">This line must measure 50 mm</text></svg>